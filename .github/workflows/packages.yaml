name: Build package feed

# Builds the presence-detector OpenWrt packages and publishes a custom
# package feed to GitHub Pages (see issue #95, option 2).
#
# The packages are PKGARCH:=all (pure scripts), so one build per
# package-manager generation works on every target arch:
#   ipk feed - OpenWrt 24.10 SDK (opkg)
#   apk feed - OpenWrt 25.12 SDK (apk)
#
# The Makefile bundles its source from this checkout (no download, no
# PKG_HASH), so the whole repository is mounted as the feed. PKG_VERSION is
# stamped from the release tag below.
#
# Signing: the feeds are signed with keys from base64-encoded repository
# secrets - IPK_BUILD_PRIVATE_KEY/IPK_BUILD_PUBLIC_KEY (usign) and
# APK_BUILD_PRIVATE_KEY/APK_BUILD_PUBLIC_KEY (EC, PEM). The public key is
# published next to each feed for users to install. Without the secrets
# (e.g. on a fork) an unsigned feed is built, with a warning.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build ${{ matrix.name }} feed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ipk
            arch: x86_64-openwrt-24.10
          - name: apk
            arch: x86_64-openwrt-25.12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp package version from tag
        run: |
          # On a tag push use the tag (v3.2.0 -> 3.2.0); on a manual run use
          # the most recent tag, so versions always stay valid for apk.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(git describe --tags --abbrev=0 | sed 's/^v//')"
          fi
          echo "Packaging version ${VERSION}"
          sed -i "s/^PKG_VERSION:=.*/PKG_VERSION:=${VERSION}/" openwrt/presence-detector/Makefile
          grep '^PKG_VERSION' openwrt/presence-detector/Makefile

      - name: Decode signing key
        env:
          PRIV_B64: ${{ matrix.name == 'ipk' && secrets.IPK_BUILD_PRIVATE_KEY || secrets.APK_BUILD_PRIVATE_KEY }}
          PUB_B64: ${{ matrix.name == 'ipk' && secrets.IPK_BUILD_PUBLIC_KEY || secrets.APK_BUILD_PUBLIC_KEY }}
          # gh-action-sdk reads the usign key from KEY_BUILD and the apk key
          # from PRIVATE_KEY.
          KEY_VAR: ${{ matrix.name == 'ipk' && 'KEY_BUILD' || 'PRIVATE_KEY' }}
        run: |
          if [ -z "$PRIV_B64" ] || [ -z "$PUB_B64" ]; then
            echo "::warning::No signing key secrets - building an UNSIGNED ${{ matrix.name }} feed"
            exit 0
          fi
          KEY=$(echo "$PRIV_B64" | base64 -d)
          # The secret is masked in logs only in its base64 form.
          echo "$KEY" | while IFS= read -r line; do
            [ -n "$line" ] && echo "::add-mask::$line"
          done
          { echo "$KEY_VAR<<EOF_KEY"; echo "$KEY"; echo "EOF_KEY"; } >> "$GITHUB_ENV"
          echo "$PUB_B64" | base64 -d > "$RUNNER_TEMP/public-key"

      - name: Build packages + index
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEEDNAME: presence_detector
          # One source package; it produces both presence-detector and
          # presence-detector-sh.
          PACKAGES: presence-detector
          INDEX: '1'
          V: s

      - name: Collect feed artifacts
        run: |
          # Only our own feed directory - bin/ also holds index files for the
          # SDK's other feeds, which must not end up in ours.
          SRC=$(find bin/packages -mindepth 2 -maxdepth 2 -type d -name presence_detector)
          [ -n "$SRC" ] || { echo "No presence_detector feed directory produced"; exit 1; }
          mkdir -p feed/${{ matrix.name }}
          cp -v "$SRC"/* feed/${{ matrix.name }}/
          ls feed/${{ matrix.name }}/*.${{ matrix.name }} >/dev/null || { echo "No .${{ matrix.name }} packages built"; exit 1; }
          # Public key for users: usign key for opkg, PEM for apk.
          if [ -f "$RUNNER_TEMP/public-key" ]; then
            EXT=${{ matrix.name == 'ipk' && 'pub' || 'pem' }}
            cp -v "$RUNNER_TEMP/public-key" "feed/${{ matrix.name }}/presence-detector.$EXT"
          fi

      - name: Upload feed artifact
        uses: actions/upload-artifact@v4
        with:
          name: feed-${{ matrix.name }}
          path: feed/${{ matrix.name }}

  publish:
    name: Publish feed to Pages
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Gather feeds
        uses: actions/download-artifact@v4
        with:
          path: site
      - name: Lay out site
        run: |
          # download-artifact nests under feed-<name>/; publish as /<name>/
          mkdir -p public
          for d in site/feed-*; do
            n="${d##*/feed-}"
            mkdir -p "public/$n"
            cp -r "$d"/. "public/$n"/
          done
          ls -R public
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
